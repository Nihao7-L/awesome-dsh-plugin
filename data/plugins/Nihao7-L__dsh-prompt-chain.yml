  en: "One-click 💪 prompt enhancement in the composer: thin draft? continue 🔜 up to 5 rounds; unhappy? regenerate 🔄 from the original or the last prompt; every round is auto-archived 🕐 and you can roll back ↩️; the result syncs back to the composer with a line-by-line diff; you customise 🗺️ whether the panel shows, the 🪄 prompt-button icon, 📍 and the button position yourself."
